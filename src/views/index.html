<!--
Vista de Login
- Estructura principal de inicio de sesión con cambio de tema.
- Formulario: usuario y contraseña con validación mínima.
- Modal: mensajes de éxito/error reutilizables.
- Script: carga módulo principal de la app.
-->
<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | U.E Colegio Dr. Jacinto Convit</title>
    <link rel="shortcut icon" href="../public/img/icon-colegio.png">    
    <link rel="stylesheet" href="../public/css/tailwind.css">
    <link rel="stylesheet" href="../public/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../public/css/login-register.css">
    <link rel="stylesheet" href="../public/css/modal.css">
</head>

<body class="min-h-screen flex justify-center items-center px-4 bg-gray-50 dark:bg-gray-900 transition-colors duration-300 font-poppins">
    <!-- Botón de cambio de tema -->
    <button id="cambio-color" class="fixed top-6 right-6 z-50 p-3 rounded-full bg-white dark:bg-gray-800 shadow-lg hover:shadow-xl transition-all duration-300 border border-gray-200 dark:border-gray-700">
        <i class="fas fa-moon text-gray-700 dark:text-yellow-400 text-lg"></i>
    </button>

    <!-- Contenedor principal -->
    <main class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md p-8 grid gap-6 transition-colors duration-300 animate-fade-in">
        <!-- Logo y título -->
        <div class="flex flex-col items-center text-center mb-1">
            <img src="../public/img/logoColegio-blanco.png" alt="Logo Colegio" class="w-80 h-80 object-contain ">
            <p class="text-gray-600 dark:text-gray-300 text-sm mt-2">Bienvenido al portal del colegio. Inicia sesión para continuar.</p>
        </div>

        <!-- Formulario de inicio de sesión -->
        <form id="loginForm" class="grid gap-4" novalidate>
            <div class="animate-slide-up" style="animation-delay: 0.1s">
                <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Usuario</label>
                <input id="username" type="text" name="username" placeholder="Ingresa tu usuario" required
                    class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-colegio-blue transition-all duration-200 dark:bg-gray-700 dark:text-white placeholder-gray-500 dark:placeholder-gray-400">
                <p class="text-red-500 text-xs mt-1 hidden" id="usernameError">Por favor ingresa tu usuario</p>
            </div>

            <div class="animate-slide-up" style="animation-delay: 0.2s">
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Contraseña</label>
                <input id="password" type="password" name="password" placeholder="Ingresa tu contraseña" required
                    class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-colegio-blue transition-all duration-200 dark:bg-gray-700 dark:text-white placeholder-gray-500 dark:placeholder-gray-400">
                <p class="text-red-500 text-xs mt-1 hidden" id="passwordError">Por favor ingresa tu contraseña</p>
            </div>

            <button type="submit" id="submitButton"
                    class="w-full bg-colegio-blue hover:bg-colegio-darkblue text-white font-semibold py-3 rounded-lg transition-all duration-200 flex justify-center items-center mt-2 animate-slide-up shadow-md hover:shadow-lg"
                    style="animation-delay: 0.3s">
                <span id="buttonText">Iniciar Sesión</span>
                <svg id="loadingSpinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
    </main>

    <!-- Modal -->
    <div id="modalContainer" class="modal-container" aria-hidden="true" role="dialog" aria-labelledby="modalTitle" aria-describedby="modalMessage">
        <div id="modalContent" class="modal-content bg-white dark:bg-gray-800 transition-colors duration-300">
            <div id="modalHeader" class="modal-header bg-colegio-blue dark:bg-colegio-darkblue">
                <div class="flex items-center">
                    <i id="modalIcon" class="modal-icon"></i>
                    <h2 id="modalTitle" class="text-xl font-bold text-white"></h2>
                </div>
                <button id="modalClose" class="text-white hover:text-gray-200 text-xl transition-colors duration-200" aria-label="Cerrar modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modalBody" class="modal-body">
                <p id="modalMessage" class="text-gray-700 dark:text-gray-300"></p>
            </div>
            <div class="modal-footer">
                <button id="modalAction" class="px-4 py-2 rounded-lg font-medium text-white bg-colegio-blue hover:bg-colegio-darkblue transition-colors duration-200">
                    Aceptar
                </button>
                <button id="modalCancel"
                    class="px-4 py-2 rounded-lg font-medium text-gray-700 dark:text-gray-300 bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500 transition-colors duration-200"
                    style="display: none;">
                    Cancelar
                </button>
            </div>
        </div>
    </div>
    
    <script type="module" src="../js/app.js"></script>
</body>

</html>
